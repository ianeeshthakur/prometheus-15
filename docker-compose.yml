# Local/demo orchestration for client + server. Mirrors the non-Docker setup in
# docs/backend.md §11 and docs/frontend.md §1 -- same default ports (8000, and 5173
# via Vite's dev server locally; this compose file serves the client's production
# build on 80 instead, since that's what nginx actually serves).
#
# SQLite by default (server's DATABASE_URL), matching local dev -- switch to a
# Postgres+PostGIS service + DATABASE_URL override for anything beyond a demo
# (server/migrations/001_postgis_setup.sql is written but not wired into this file,
# since it's unverified against a real Postgres instance as of docs/backend.md §12.7).
services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hls_output:/app/hls_output
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  hls_output:
