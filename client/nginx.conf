server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom's BrowserRouter (App.jsx) needs every path to fall back to
    # index.html -- otherwise a direct load/refresh of e.g. /watchlists 404s at the
    # nginx layer before React Router ever sees the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
